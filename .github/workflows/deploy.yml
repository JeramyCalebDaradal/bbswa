name: Deploy BBSWebsite

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: bbswebsite
  CONTAINER_NAME: bbsfrontend
  REGISTRY_DIR: /opt/bbs/images

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Build frontend image ──
      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:latest \
                       -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
                       --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
                       .

      # ── Save image as tarball ──
      - name: Save image to tarball
        run: |
          docker save ${{ env.IMAGE_NAME }}:${{ github.sha }} | gzip > ${{ env.IMAGE_NAME }}-${{ github.sha }}.tar.gz

      # ── Setup SSH key ──
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # ── Copy tarball to server ──
      - name: Copy tarball to server
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "mkdir -p ${{ env.REGISTRY_DIR }}"
          scp -i ~/.ssh/deploy_key \
            ${{ env.IMAGE_NAME }}-${{ github.sha }}.tar.gz \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.REGISTRY_DIR }}/

      # ── Deploy on server ──
      - name: Deploy container on server
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'DEPLOYSCRIPT'
            set -e

            IMAGE_NAME="bbswebsite"
            CONTAINER_NAME="bbsfrontend"
            SHA="${{ github.sha }}"
            REGISTRY_DIR="${{ env.REGISTRY_DIR }}"
            VERSION_FILE="${REGISTRY_DIR}/.deploy-versions"
            NETWORK_NAME="bbsnet"

            echo "=== Loading new image ==="
            gunzip -c "${REGISTRY_DIR}/${IMAGE_NAME}-${SHA}.tar.gz" | docker load
            rm -f "${REGISTRY_DIR}/${IMAGE_NAME}-${SHA}.tar.gz"

            echo "=== Updating version manifest ==="
            mkdir -p "$(dirname "${VERSION_FILE}")"
            touch "${VERSION_FILE}"
            { echo "${SHA}"; cat "${VERSION_FILE}"; } \
              | awk '!seen[$0]++' \
              | head -n 3 > "${VERSION_FILE}.tmp"
            mv "${VERSION_FILE}.tmp" "${VERSION_FILE}"

            echo "=== Pruning old images (keep last 3) ==="
            CURRENT_VERSIONS=$(cat "${VERSION_FILE}")
            docker images --format '{{.Repository}}:{{.Tag}}' \
              | grep "^${IMAGE_NAME}:" \
              | while read -r IMG; do
                  TAG="${IMG#*:}"
                  if [ "${TAG}" = "latest" ]; then
                    continue
                  fi
                  if ! echo "${CURRENT_VERSIONS}" | grep -q "^${TAG}$"; then
                    echo "  Removing old image: ${IMG}"
                    docker rmi "${IMG}" 2>/dev/null || true
                  fi
                done

            echo "=== Ensuring Docker network ==="
            docker network inspect "${NETWORK_NAME}" >/dev/null 2>&1 || \
              docker network create "${NETWORK_NAME}"

            echo "=== Stopping old container ==="
            docker stop "${CONTAINER_NAME}" 2>/dev/null || true
            docker rm "${CONTAINER_NAME}" 2>/dev/null || true

            echo "=== Starting new container ==="
            docker run -d \
              --name "${CONTAINER_NAME}" \
              --network "${NETWORK_NAME}" \
              --restart unless-stopped \
              "${IMAGE_NAME}:${SHA}"

            echo "=== Deployment complete ==="
            echo "Active versions:"
            cat "${VERSION_FILE}"
DEPLOYSCRIPT