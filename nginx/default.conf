server {
  listen 80;
  server_name _;

  # Hide nginx version
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # ──────────────────────────────────────────────
  #  Frontend SPA
  # ──────────────────────────────────────────────
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ──────────────────────────────────────────────
  #  PL22: API path obfuscation
  #  Public clients use /x42/api/* and /x42/admin/*
  #  Direct /api/* and /admin/* return 404 (hide real routes)
  # ──────────────────────────────────────────────

  # Block direct access to real API routes — prevents enumeration
  location /api/ {
    return 404;
  }

  location /admin/ {
    return 404;
  }

  # Public-facing obfuscated API path
  # Maps: /x42/api/articles → backend /api/articles
  location /x42/api/ {
    rewrite ^/x42/api/(.*)$ /api/$1 break;
    proxy_pass http://bbsbackend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
  }

  # Public-facing obfuscated admin path
  # Maps: /x42/admin/users → backend /admin/users
  location /x42/admin/ {
    rewrite ^/x42/admin/(.*)$ /admin/$1 break;
    proxy_pass http://bbsbackend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
  }

  # ──────────────────────────────────────────────
  #  Static assets (if any)
  # ──────────────────────────────────────────────
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}